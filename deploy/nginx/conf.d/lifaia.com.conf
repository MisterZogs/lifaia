# lifaia.com — frontend (fichiers statiques)
server {
    listen 80;
    server_name lifaia.com www.lifaia.com;
    return 301 https://lifaia.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.lifaia.com;
    ssl_certificate /etc/letsencrypt/live/lifaia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifaia.com/privkey.pem;
    return 301 https://lifaia.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lifaia.com;

    ssl_certificate /etc/letsencrypt/live/lifaia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifaia.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/lifaia;
    index index.html;

    # SPA — toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache pour les assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# api.lifaia.com — backend Node.js
server {
    listen 80;
    server_name api.lifaia.com;
    return 301 https://api.lifaia.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.lifaia.com;

    ssl_certificate /etc/letsencrypt/live/lifaia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifaia.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # SSE — streaming sans timeout
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
